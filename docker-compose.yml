services:
  mongodb:
    image: mongo:7.0
    container_name: swork-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: swork_db
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init/init-indexes.js:/docker-entrypoint-initdb.d/init-indexes.js:ro
    networks:
      - swork-net

  mongo-express:
    image: mongo-express:latest
    container_name: swork-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: secretpassword
      ME_CONFIG_MONGODB_URL: mongodb://root:secretpassword@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - swork-net

volumes:
  mongo_data:
    driver: local

networks:
  swork-net:
    driver: bridge
