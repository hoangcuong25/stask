<div class="modal-overlay" *ngIf="isOpen" (click)="close()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-title-box">
        <svg class="header-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <h2 class="modal-title">Tạo công việc mới</h2>
      </div>
      <button class="btn-close" (click)="close()" title="Đóng">✕</button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <!-- Error Alert -->
      <div class="alert-error" *ngIf="errorMessage">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <!-- Task Title -->
      <div class="form-group full-width">
        <label class="form-label required">Tiêu đề công việc</label>
        <input
          type="text"
          class="form-control title-input"
          placeholder="Nhập tên công việc cần làm..."
          [(ngModel)]="title"
          autofocus>
      </div>

      <!-- Form Grid 2 columns -->
      <div class="form-grid">
        <!-- Project -->
        <div class="form-group">
          <label class="form-label required">Dự án</label>
          <select class="form-control" [(ngModel)]="projectId" (ngModelChange)="onProjectChange()">
            <option *ngFor="let p of projects" [value]="p.id">{{ p.name }} ({{ p.code }})</option>
          </select>
        </div>

        <!-- Stage -->
        <div class="form-group">
          <label class="form-label">Giai đoạn dự án</label>
          <select class="form-control" [(ngModel)]="stageId">
            <option *ngFor="let s of currentStages" [value]="s.id">{{ s.name }}</option>
          </select>
        </div>

        <!-- Assignee -->
        <div class="form-group">
          <label class="form-label">Người thực hiện</label>
          <select class="form-control" [(ngModel)]="assigneeId">
            <option *ngFor="let u of users" [value]="u.id">
              {{ u.fullName }} ({{ u.role === 'SYSTEM_OWNER' ? 'System owner' : (u.role === 'ADMIN' ? 'Admin' : 'Thành viên') }})
            </option>
          </select>
        </div>

        <!-- Priority -->
        <div class="form-group">
          <label class="form-label">Độ ưu tiên</label>
          <select class="form-control" [(ngModel)]="priority">
            <option value="URGENT">🟥 Khẩn cấp</option>
            <option value="HIGH">🟧 Cao</option>
            <option value="MEDIUM">🟦 Trung bình</option>
            <option value="LOW">⬜ Thấp</option>
          </select>
        </div>

        <!-- Status -->
        <div class="form-group">
          <label class="form-label">Trạng thái</label>
          <select class="form-control" [(ngModel)]="status">
            <option value="TODO">Cần làm</option>
            <option value="IN_PROGRESS">Đang thực hiện</option>
            <option value="IN_REVIEW">Chờ xét duyệt</option>
            <option value="DONE">Hoàn thành</option>
          </select>
        </div>

        <!-- Due Date -->
        <div class="form-group">
          <label class="form-label">Hạn hoàn thành</label>
          <input type="date" class="form-control" [(ngModel)]="dueDate">
        </div>

        <!-- Estimated Hours -->
        <div class="form-group">
          <label class="form-label">Thời gian ước tính (giờ)</label>
          <input type="number" class="form-control" min="1" max="500" [(ngModel)]="estimatedHours">
        </div>

        <!-- Personal Plan Bucket -->
        <div class="form-group">
          <label class="form-label">Kế hoạch cá nhân</label>
          <select class="form-control" [(ngModel)]="planBucket">
            <option value="UNPLANNED">Chưa sắp xếp</option>
            <option value="TODAY">Hôm nay</option>
            <option value="THIS_WEEK">Tuần này</option>
            <option value="LATER">Để sau</option>
          </select>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group full-width">
        <label class="form-label">Mô tả chi tiết</label>
        <textarea
          class="form-control textarea"
          rows="3"
          placeholder="Mô tả yêu cầu cụ thể, mục tiêu và tài liệu liên quan..."
          [(ngModel)]="description"></textarea>
      </div>

      <!-- Checklists -->
      <div class="form-group full-width">
        <label class="form-label">Checklist công việc ban đầu</label>
        <div class="checklist-input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Thêm đầu mục cần làm (vd: Thiết kế wireframe...)"
            [(ngModel)]="checklistInput"
            (keydown.enter)="addChecklist()">
          <button flxButton status="default" size="sm" type="button" (click)="addChecklist()">+ Thêm</button>
        </div>

        <!-- Checklist Item List -->
        <div class="checklist-items" *ngIf="checklists.length > 0">
          <div class="ck-item" *ngFor="let item of checklists; let i = index">
            <span>{{ i + 1 }}. {{ item }}</span>
            <button type="button" class="btn-remove-ck" (click)="removeChecklist(i)">✕</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button flxButton status="default" type="button" (click)="close()">Hủy bỏ</button>
      <button flxButton status="primary" type="button" [disabled]="isSubmitting" (click)="onSubmit()">
        <span *ngIf="isSubmitting">Đang lưu vào MongoDB...</span>
        <span *ngIf="!isSubmitting">+ Tạo công việc</span>
      </button>
    </div>
  </div>
</div>
