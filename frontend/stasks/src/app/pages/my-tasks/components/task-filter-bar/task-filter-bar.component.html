<div class="toolbar">
  <div class="filter-left">
    <!-- Search Field -->
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Tìm công việc" [(ngModel)]="searchKeyword" (ngModelChange)="onSearchChange()">
    </div>

    <!-- Select: Loại -->
    <div class="filter-select-wrapper">
      <select [(ngModel)]="selectedType" (ngModelChange)="onTypeChange()">
        <option value="">Loại: Tất cả</option>
        <option value="TASK">Công việc</option>
        <option value="BUG">Lỗi (Bug)</option>
      </select>
      <svg class="select-chevron" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <!-- Select: Trạng thái -->
    <div class="filter-select-wrapper">
      <select [(ngModel)]="selectedStatus" (ngModelChange)="onStatusChange()">
        <option value="">Trạng thái: Tất cả</option>
        <option value="TODO">Cần làm</option>
        <option value="IN_PROGRESS">Đang thực hiện</option>
        <option value="IN_REVIEW">Chờ duyệt</option>
        <option value="DONE">Hoàn thành</option>
      </select>
      <svg class="select-chevron" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <!-- Select: Ưu tiên -->
    <div class="filter-select-wrapper">
      <select [(ngModel)]="selectedPriority" (ngModelChange)="onPriorityChange()">
        <option value="">Ưu tiên: Tất cả</option>
        <option value="URGENT">Khẩn cấp</option>
        <option value="HIGH">Cao</option>
        <option value="MEDIUM">Trung bình</option>
        <option value="LOW">Thấp</option>
      </select>
      <svg class="select-chevron" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <!-- Select: Người thực hiện -->
    <div class="filter-select-wrapper">
      <select [(ngModel)]="selectedAssignee" (ngModelChange)="onAssigneeChange()">
        <option value="">Người thực hiện: Tất cả</option>
        <option value="Nguyễn Lan">Nguyễn Lan</option>
        <option value="Trần Minh">Trần Minh</option>
        <option value="Phạm An">Phạm An</option>
        <option value="Đỗ Khang">Đỗ Khang</option>
      </select>
      <svg class="select-chevron" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  <!-- View Mode Switcher Dropdown (Right side) using FlxButton -->
  <div class="view-switcher-container">
    <button flxButton status="default" size="sm" class="btn-view-switcher" (click)="toggleViewMenu()">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" *ngIf="currentViewMode === 'DEFAULT' || currentViewMode === 'TABLE'"></path>
        <rect x="3" y="3" width="7" height="18" rx="1" *ngIf="currentViewMode === 'KANBAN'"></rect>
        <rect x="14" y="3" width="7" height="11" rx="1" *ngIf="currentViewMode === 'KANBAN'"></rect>
        <rect x="3" y="4" width="18" height="18" rx="2" *ngIf="currentViewMode === 'CALENDAR'"></rect>
        <path d="M16 2v4M8 2v4M3 10h18" *ngIf="currentViewMode === 'CALENDAR'"></path>
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" *ngIf="currentViewMode === 'USER'"></path>
        <circle cx="12" cy="7" r="4" *ngIf="currentViewMode === 'USER'"></circle>
        <circle cx="12" cy="12" r="10" *ngIf="currentViewMode === 'STATUS'"></circle>
        <polyline points="12 6 12 12 16 14" *ngIf="currentViewMode === 'STATUS'"></polyline>
        <line x1="4" y1="6" x2="16" y2="6" stroke-width="3" *ngIf="currentViewMode === 'GANTT'"></line>
        <line x1="8" y1="12" x2="20" y2="12" stroke-width="3" *ngIf="currentViewMode === 'GANTT'"></line>
        <line x1="6" y1="18" x2="14" y2="18" stroke-width="3" *ngIf="currentViewMode === 'GANTT'"></line>
      </svg>
      <span>{{ viewModeLabel }}</span>
      <svg class="chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <!-- Dropdown Menu -->
    <div class="view-menu" *ngIf="showViewMenu">
      <div class="view-menu-item" [class.active]="currentViewMode === 'DEFAULT'" (click)="selectViewMode('DEFAULT')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>Mặc định (Theo giai đoạn)</span>
      </div>
      <div class="view-menu-item" [class.active]="currentViewMode === 'TABLE'" (click)="selectViewMode('TABLE')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Bảng (Table)</span>
      </div>
      <div class="view-menu-item" [class.active]="currentViewMode === 'KANBAN'" (click)="selectViewMode('KANBAN')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="18" rx="1"></rect>
          <rect x="14" y="3" width="7" height="11" rx="1"></rect>
        </svg>
        <span>Kanban (Trạng thái)</span>
      </div>
      <div class="view-menu-item" [class.active]="currentViewMode === 'CALENDAR'" (click)="selectViewMode('CALENDAR')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Lịch (Calendar)</span>
      </div>
      <div class="view-menu-item" [class.active]="currentViewMode === 'USER'" (click)="selectViewMode('USER')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Người dùng (User)</span>
      </div>
      <div class="view-menu-item" [class.active]="currentViewMode === 'STATUS'" (click)="selectViewMode('STATUS')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Trạng thái (Status)</span>
      </div>
      <div class="view-menu-item" [class.active]="currentViewMode === 'GANTT'" (click)="selectViewMode('GANTT')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6" x2="16" y2="6" stroke-width="2.5"></line>
          <line x1="8" y1="12" x2="20" y2="12" stroke-width="2.5"></line>
          <line x1="6" y1="18" x2="14" y2="18" stroke-width="2.5"></line>
        </svg>
        <span>Sơ đồ Gantt</span>
      </div>
    </div>
  </div>
</div>
